<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Radar de Trade - Com Persistência</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #eee; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .painel { background-color: #262626; padding: 20px; border-radius: 10px; width: 350px; }
        .linha { margin-bottom: 10px; display: flex; justify-content: space-between; }
        input, select { width: 80px; padding: 5px; text-align: center; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
        .historico { width: 100%; max-width: 800px; margin-top: 20px; background: #262626; padding: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="painel">
        <label>Minuto:</label><input type="number" id="minuto" value="10"><br>
        <label>Odd Inicial Time:</label><input type="number" step="0.01" id="oddInicial" value="1.42"><br>
        <label>Odd Real Time:</label><input type="number" step="0.01" id="oddReal" value="1.53"><br>
        <label>Odd Inicial Gols:</label><input type="number" step="0.01" id="oddGolsInicial" value="1.36"><br>
        <label>Odd Real Gols:</label><input type="number" step="0.01" id="oddGolsReal" value="2.10"><br>
        <button onclick="registrar()">Registrar Log</button>
        <button onclick="limparTudo()" style="background: #dc3545; color: white;">Limpar Histórico</button>
        <div id="status" style="margin-top:10px; font-weight:bold;"></div>
    </div>
</div>

<div class="historico">
    <table>
        <thead><tr><th>Minuto</th><th>Odd Time</th><th>Odd Gols</th><th>Status</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('tradeLogs')) || [];

    function registrar() {
        let m = document.getElementById('minuto').value;
        let oRT = parseFloat(document.getElementById('oddReal').value);
        let oRG = parseFloat(document.getElementById('oddGolsReal').value);
        
        // Matemática linear conservadora
        let oET = parseFloat(document.getElementById('oddInicial').value) + (m/90 * 0.5);
        let oEG = parseFloat(document.getElementById('oddGolsInicial').value) + (m/90 * 0.5);
        
        let status = (oRT < oET - 0.1 && oRG < oEG - 0.1) ? "GATILHO!" : (oRT < oET - 0.1 ? "FALSO POSITIVO" : "NORMAL");

        logs.push({m, oRT, oRG, status});
        localStorage.setItem('tradeLogs', JSON.stringify(logs));
        renderizar();
    }

    function renderizar() {
        let tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = logs.map(l => `<tr><td>${l.m}'</td><td>${l.oRT}</td><td>${l.oRG}</td><td>${l.status}</td></tr>`).join('');
    }

    function limparTudo() {
        localStorage.removeItem('tradeLogs');
        logs = [];
        renderizar();
    }

    renderizar();
</script>
</body>
</html>
