<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Trade Pro</title>
    <style>
        /* Estilos mantidos e otimizados */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f141c; color: #f1f5f9; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 10px; padding: 25px; border: 1px solid #334155; margin-bottom: 20px; }
        input, select { width: 100%; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 12px; color: #ffffff; }
        .btn-salvar { width: 100%; background-color: #3b82f6; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; }
        .btn-export { background-color: #10b981; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #0f172a; padding: 12px; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-layout" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <h3>Dados em Tempo Real</h3>
            <input type="text" id="jogo" placeholder="Nome do Jogo" oninput="calcular()">
            <input type="number" id="minuto" placeholder="Minuto" oninput="calcular()">
            <input type="number" id="ap" placeholder="Ataques Perigosos" oninput="calcular()">
            <input type="number" id="finalizacoes" placeholder="Finalizações" oninput="calcular()">
            <input type="number" id="escanteios" placeholder="Escanteios" oninput="calcular()">
            <select id="pressao" onchange="calcular()"><option value="Não">Sem Pressão</option><option value="Sim">Pressão Alta</option></select>
            <input type="number" id="odd" placeholder="Odd Atual" step="0.01">
            <button class="btn-salvar" onclick="salvarNoHistorico()">Registrar Partida</button>
        </div>

        <div class="card">
            <h3>Indicadores</h3>
            <div id="decisao-box" style="padding: 20px; text-align: center; font-weight: bold;">AGUARDANDO</div>
            <button class="btn-salvar btn-export" onclick="exportarCSV()">Exportar Histórico (CSV)</button>
        </div>
    </div>

    <div class="card">
        <h3>Log de Operações</h3>
        <table id="historico-tabela">
            <thead><tr><th>Jogo</th><th>Min</th><th>APPM</th><th>Decisão</th><th>Resultado</th></tr></thead>
            <tbody id="historico-corpo"></tbody>
        </table>
    </div>
</div>

<script>
    // Carrega dados do LocalStorage ao iniciar
    document.addEventListener('DOMContentLoaded', carregarHistorico);

    function calcular() {
        const minuto = parseFloat(document.getElementById('minuto').value) || 0;
        const ap = parseFloat(document.getElementById('ap').value) || 0;
        const appm = minuto > 0 ? (ap / minuto).toFixed(2) : "0.00";
        document.getElementById('decisao-box').innerText = "APPM: " + appm;
    }

    function salvarNoHistorico() {
        const data = {
            jogo: document.getElementById('jogo').value,
            min: document.getElementById('minuto').value,
            appm: (document.getElementById('ap').value / document.getElementById('minuto').value).toFixed(2),
            decisao: "Analisado",
            resultado: "Aberto"
        };

        let historico = JSON.parse(localStorage.getItem('trade_log') || '[]');
        historico.unshift(data);
        localStorage.setItem('trade_log', JSON.stringify(historico));
        renderizarTabela();
    }

    function carregarHistorico() { renderizarTabela(); }

    function renderizarTabela() {
        const corpo = document.getElementById('historico-corpo');
        const historico = JSON.parse(localStorage.getItem('trade_log') || '[]');
        corpo.innerHTML = historico.map(h => `<tr><td>${h.jogo}</td><td>${h.min}</td><td>${h.appm}</td><td>${h.decisao}</td><td>${h.resultado}</td></tr>`).join('');
    }

    function exportarCSV() {
        const historico = JSON.parse(localStorage.getItem('trade_log') || '[]');
        let csv = "Jogo,Minuto,APPM,Decisao,Resultado\n";
        historico.forEach(row => csv += `${row.jogo},${row.min},${row.appm},${row.decisao},${row.resultado}\n`);
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'trade_log.csv'; a.click();
    }
</script>
</body>
</html>
