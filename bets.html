<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Radar Profissional - Time Decay</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .painel { background-color: #2d2d2d; border: 1px solid #444; padding: 20px; max-width: 350px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .linha-input { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        input { padding: 8px; width: 80px; text-align: center; border: 1px solid #555; border-radius: 4px; background-color: #111; color: #fff; font-weight: bold; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .resultado { margin-top: 20px; padding-top: 15px; border-top: 1px solid #444; }
        .destaque { font-size: 22px; color: #00ffcc; font-weight: bold; }
        .alerta-perigo { color: white; background-color: #dc3545; padding: 12px; font-weight: bold; text-align: center; border-radius: 4px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <h2>Radar de Anomalia (Empate)</h2>
    
    <div class="painel">
        <div class="linha-input">
            <label>Minuto Atual do Jogo:</label>
            <input type="number" id="minuto" placeholder="Ex: 75" min="0" max="90">
        </div>
        <div class="linha-input">
            <label>Odd Inicial (Pré-Live):</label>
            <input type="number" step="0.01" id="oddInicial" placeholder="Ex: 3.50">
        </div>
        <div class="linha-input">
            <label>Odd Real na Betfair Agora:</label>
            <input type="number" step="0.01" id="oddReal" placeholder="Ex: 2.10">
        </div>

        <button onclick="calcularOdd()">Analisar Mercado</button>

        <div class="resultado">
            <p>Odd Matemática Esperada: <span id="resultadoOdd" class="destaque">-</span></p>
        </div>
        
        <div id="caixaAlerta" class="alerta-perigo">
            ⚠️ OPA! O mercado está segurando a odd. Há pressão de gol!
        </div>
    </div>

    <script>
        function calcularOdd() {
            // 1. Pega os valores que você digitou
            let minuto = parseFloat(document.getElementById('minuto').value);
            let oddInicial = parseFloat(document.getElementById('oddInicial').value);
            let oddReal = parseFloat(document.getElementById('oddReal').value);

            // Validação simples para evitar erros
            if(isNaN(minuto) || isNaN(oddInicial) || isNaN(oddReal) || minuto < 0 || minuto > 90) {
                alert("Por favor, preencha todos os campos corretamente. O minuto deve ser entre 0 e 90.");
                return;
            }

            // 2. A Matemática Profissional (Curva de Decaimento)
            let probInicial = 1 / oddInicial;
            let fatorTempo = Math.pow((minuto / 90), 2.5); // O expoente 2.5 cria a curva do futebol
            let probAtual = probInicial + ((1 - probInicial) * fatorTempo);
            
            let oddEsperada = 1 / probAtual;

            // 3. Mostra o resultado na tela arredondado para 2 casas decimais
            document.getElementById('resultadoOdd').innerText = oddEsperada.toFixed(2);

            // 4. Lógica do Alerta (Margem de anomalia)
            // Se a odd real estiver acima do esperado, não tem perigo (jogo morno).
            // Se a odd real estiver "agarrada" (ex: mercado oferecendo 2.50 quando a matemática pede 2.10)
            
            // Defini uma margem de segurança de 0.20 ticks (você pode ajustar depois)
            let margem = 0.20; 

            if (oddReal > (oddEsperada + margem)) {
                // Alerta ativado!
                document.getElementById('caixaAlerta').style.display = 'block';
            } else {
                // Tudo normal, esconde o alerta
                document.getElementById('caixaAlerta').style.display = 'none';
            }
        }
    </script>

</body>
</html>
